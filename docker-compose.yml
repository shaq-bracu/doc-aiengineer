services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: docintel, POSTGRES_PASSWORD: docintel, POSTGRES_DB: docintel }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U docintel"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://docintel:docintel@db:5432/docintel
    depends_on: { db: { condition: service_healthy } }
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]
volumes: { pgdata: {}, uploads: {} }
